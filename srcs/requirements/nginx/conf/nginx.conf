server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pskrucha.42.fr;
    root /var/www/html/pskrucha.42.fr;
    ssl_certificate /etc/ssl/certs/ssl-cert.pem;
    ssl_certificate_key /etc/ssl/certs/ssl-cert.key;
    index index.php index.html index.htm;

    location / {
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # Serve Adminer
    location /adminer {
        root /var/www/html/adminer;
        index index.php;
        try_files $uri /adminer/index.php;
    }

    # PHP handling for Adminer
    location ~ ^/adminer/(.*\.php)$ {
        root /var/www/html/adminer;
        fastcgi_pass wordpress:9000;  # Send PHP files to WordPress container
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/adminer/$1;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # General PHP Handling
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
