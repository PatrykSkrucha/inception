services:
  nginx:
    container_name: nginx
    build:
      context: requirements/nginx/
      dockerfile: Dockerfile
    restart: always
    ports:
      - 443:443
    expose:
      - 9000
      - 443
    env_file:
      - .env
    volumes:
      - wp_vol:/var/www/html
      - adminer_vol:/var/www/html/adminer
    depends_on:
      - wordpress
      - adminer
    networks:
      - inception

  wordpress:
    container_name: wordpress
    build:
      context: requirements/wordpress/
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    volumes:
      - wp_vol:/var/www/html
      - adminer_vol:/var/www/html/adminer
    expose:
      - 9000
      - 3306
    depends_on:
      - mariadb
      - redis
      - adminer
    networks:
      - inception

  mariadb:
    container_name: mariadb
    build:
      context: requirements/mariadb/
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    volumes:
      - db_vol:/var/lib/mysql
    expose:
      - 3306
    networks:
      - inception

  redis:
    container_name: redis
    build:
      context: requirements/redis/
      dockerfile: Dockerfile
    restart: always
    expose:
    - 6379
    networks:
      - inception

  adminer:
    container_name: adminer
    build: 
      context: requirements/adminer
      dockerfile: Dockerfile
    expose:
      - 9001
    restart: always
    networks:
      - inception
    depends_on:
      - mariadb
    volumes:
      - adminer_vol:/var/www/html/adminer

  ftp:
    container_name: ftp
    build:
      context: requirements/ftp
      dockerfile: Dockerfile
      args:
        WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    networks:
      - inception
    env_file:
      - .env
    volumes:
      - wp_vol:/home/ftpuser/wordpress
    depends_on:
      - wordpress

networks:
  inception:
    name: inception
    driver: bridge

volumes:
  adminer_vol:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /home/${USER}/data/adminer_vol
  wp_vol:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /home/${USER}/data/wp_vol
  db_vol:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /home/${USER}/data/db_vol