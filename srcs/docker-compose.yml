services:
  nginx:
    container_name: nginx
    build:
      context: requirements/nginx/
      dockerfile: Dockerfile
    restart: always
    ports:
      - 443:443
    expose:
      - 9000
      - 443
    env_file:
      - .env
    volumes:
      - /home/${USER}/data/wp_vol:/var/www/html
      - adminer_vol:/var/www/html/adminer
    depends_on:
      - wordpress
      - adminer
    networks:
      - inception

  wordpress:
    container_name: wordpress
    build:
      context: requirements/wordpress/
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    volumes:
      - /home/${USER}/data/wp_vol:/var/www/html
      - adminer_vol:/var/www/html/adminer
    expose:
      - 9000
      - 3306
    depends_on:
      - mariadb
      - redis
      - adminer
    networks:
      - inception

  mariadb:
    container_name: mariadb
    build:
      context: requirements/mariadb/
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    volumes:
      - /home/${USER}/data/db_vol:/var/lib/mysql
    expose:
      - 3306
    networks:
      - inception

  redis:
    container_name: redis
    build:
      context: requirements/redis/
      dockerfile: Dockerfile
    restart: always
    expose:
    - 6379
    networks:
      - inception

  adminer:
    container_name: adminer
    build: 
      context: requirements/adminer
      dockerfile: Dockerfile
    expose:
      - 9000
    restart: always
    networks:
      - inception
    depends_on:
      - mariadb
    volumes:
      - adminer_vol:/var/www/html/adminer

networks:
  inception:
    driver: bridge

volumes:
  adminer_vol:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${HOME}/data/adminer_vol

