services:
  # NGINX service (custom image)
  nginx:
    container_name: nginx
    build:
      context: ./nginx/
      dockerfile: Dockerfile
    restart: always
    ports:
      - 443:443   # Expose HTTPS to the outside world
    expose:
      - 9000      # NGINX communicates with WordPress via port 9000
      - 443
    env_file:
      - .env
    volumes:
      #- ./nginx/ssl-certs/:/etc/ssl/certs/:ro
      #- ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./wp_vol:/var/www/html  # Mount WordPress files to NGINX
    depends_on:
      - wordpress
    networks:
      - inception

  # WordPress service (custom image)
  wordpress:
    container_name: wordpress
    build:
      context: ./wordpress/
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    volumes:
      - ./wp_vol:/var/www/html  # Mount WordPress files
    expose:
      - 9000      # WordPress communicates with NGINX via port 9000
      - 3306
    depends_on:
      - mariadb
    networks:
      - inception

  # MariaDB service (custom image)
  mariadb:
    container_name: mariadb
    build:
      context: ./mariadb/
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    volumes:
      - ./db_vol:/var/lib/mysql  # Mount MariaDB data
    expose:
      - 3306      # MariaDB listens on port 3306 for WordPress
    networks:
      - inception

networks:
  inception:
    driver: bridge
