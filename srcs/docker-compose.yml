services:
  # NGINX service (custom image)
  nginx:
    container_name: nginx
    build:
      context: requirements/nginx/
      dockerfile: Dockerfile
    restart: always
    ports:
      - 443:443
    expose:
      - 9000
      - 443
    env_file:
      - .env
    volumes:
      - /home/pskrucha/data/wp_vol:/var/www/html
    depends_on:
      - wordpress
    networks:
      - inception

  wordpress:
    container_name: wordpress
    build:
      context: requirements/wordpress/
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    volumes:
      - /home/pskrucha/data/wp_vol:/var/www/html
    expose:
      - 9000
      - 3306
    depends_on:
      - mariadb
    networks:
      - inception

  mariadb:
    container_name: mariadb
    build:
      context: requirements/mariadb/
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    volumes:
      - /home/pskrucha/data/db_vol:/var/lib/mysql
    expose:
      - 3306
    networks:
      - inception

networks:
  inception:
    driver: bridge
